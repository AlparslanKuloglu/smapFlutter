name: smap
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.10.7

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  image_picker: ^1.2.1
  intl: ^0.20.2
  camera: ^0.10.0
  appinio_swiper: ^2.0.0
  dartz: ^0.10.1
  dio: ^5.4.3+1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_document_scanner:
    path: ./lib/vendor/flutter_document_scanner/flutter_document_scanner
  flutter_image_compress: ^2.3.0

  flutter_native_splash: ^2.4.4
  http: ^0.13.3
  image: ^4.1.7
  path_provider: ^2.1.3
  provider: ^6.1.2
  rest_api_package: ^1.0.0+2
  shared_preferences: ^2.2.2
  flutter_inappwebview: ^6.1.5
  fl_chart: ^1.2.0
  flutter_card_swiper: ^7.2.0
  flutter_svg: ^2.0.9
  dio_cookie_manager: ^3.0.0
  cookie_jar: ^4.0.0
  google_sign_in: ^7.2.0
  flutter_html: ^3.0.0

  # State management (Stacked MVVM), DI, routing, serialization
  stacked: ^3.5.0
  get_it: ^8.0.3
  auto_route: ^11.1.0
  dart_mappable: ^4.7.0

  # Design system and UI
  mihr_ui: ^0.1.0-dev.3
  smooth_sheets: ^1.0.2
  toastification: ^3.2.0
  phosphor_flutter: ^2.1.0

  # Platform services
  permission_handler: ^12.0.1
  connectivity_plus: ^7.3.1
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.2
  share_plus: ^12.0.1
  flutter_secure_storage: ^9.2.4

  # Logging
  logger: ^2.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: "^0.13.1" # En güncel sürümü kullanabilirsiniz
  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # Code generation
  # Pinned: build_runner 2.15 AOT-compiles the build script, which fails while a
  # dependency (objective_c) has build hooks. 2.13.x uses the JIT path.
  build_runner: 2.13.1
  auto_route_generator: ^10.5.0
  dart_mappable_builder: ^4.7.0
  flutter_gen_runner: ^5.12.0


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logotext.png"
  # Android 8.0+ için adaptive icon kullanmak isterseniz:
  # adaptive_icon_background: "#FFFFFF" # veya renk kodu/arka plan görseli
  # adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/
    - assets/splash/
    - assets/icons/    # Alt klasördeki resimler için bunu EKLEMENİZ gerekir
    - assets/svgs/
    - assets/menuIcons/
    - assets/avatars/
    - assets/authors/
    - assets/authors/a/
    - assets/authors/cb/
    - assets/authors/cd/
    - assets/authors/cde/
    - assets/authors/cdmy/
    - assets/authors/cds/
    - assets/authors/cke/
    - assets/authors/cm/
    - assets/authors/ct/
    - assets/authors/ctg/
    - assets/authors/dn/
    - assets/authors/ds/
    - assets/authors/f/
    - assets/authors/m/
    - assets/authors/s/
    - assets/authors/t/
    - assets/authors/t1/
    - assets/authors/t2/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-ExtraBold.ttf
          weight: 800

# flutter_gen_runner: typed asset/font accessors (lib/gen/).
flutter_gen:
  output: lib/gen/
  line_length: 80
  integrations:
    flutter_svg: true
