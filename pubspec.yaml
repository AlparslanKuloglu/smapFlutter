name: smap
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.10.7

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  image_picker: ^1.2.1
  intl: ^0.20.2
  camera: ^0.10.0
  dartz: ^0.10.1
  dio: ^5.4.3+1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_document_scanner:
    path: ./lib/vendor/flutter_document_scanner/flutter_document_scanner
  flutter_image_compress: ^2.3.0

  flutter_native_splash: ^2.4.4
  http: ^0.13.3
  image: ^4.1.7
  path_provider: ^2.1.3
  provider: ^6.1.2
  shared_preferences: ^2.2.2
  flutter_inappwebview: ^6.1.5
  fl_chart: ^1.2.0
  flutter_card_swiper: ^7.2.0
  flutter_svg: ^2.0.9
  dio_cookie_manager: ^3.0.0
  cookie_jar: ^4.0.0
  google_sign_in: ^7.2.0
  flutter_html: ^3.0.0

  # State management (Stacked MVVM), DI, routing, serialization
  stacked: ^3.5.0
  get_it: ^8.0.3
  # Pinned to 11.1.0: 11.2.0 uses `Viewport.scrollCacheExtent` (Flutter 3.41+)
  # and does not compile on the pinned Flutter 3.38.6 (K16). Same as Sepello
  # and Memora.
  auto_route: 11.1.0
  dart_mappable: ^4.7.0

  # Design system and UI
  mihr_ui: ^0.1.0-dev.3
  smooth_sheets: ^1.0.2
  toastification: ^3.2.0
  phosphor_flutter: ^2.1.0

  # Platform services
  permission_handler: ^12.0.1
  connectivity_plus: ^7.3.1
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.2
  share_plus: ^12.0.1
  flutter_secure_storage: ^9.2.4

  # Logging
  logger: ^2.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4 # iOS dark/tinted variants
  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # Code generation
  # Pinned: build_runner 2.15 AOT-compiles the build script, which fails while a
  # dependency (objective_c) has build hooks. 2.13.x uses the JIT path.
  build_runner: 2.13.1
  auto_route_generator: ^10.5.0
  dart_mappable_builder: ^4.7.0
  flutter_gen_runner: ^5.12.0


# App icon (board 1.26 "Öneri · A, Lacivert Pafta Zemin"). Sources and SVGs live in
# assets/brand/icon/ (not bundled: assets/brand/ is not recursive). iOS gets the
# light, dark and tinted variants; Android the adaptive layers (the foreground is
# already laid out in the 108 dp grid, mark inside the 66 dp safe area, so the
# default 16 % inset is turned off). Regenerate with
# `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/brand/icon/app_icon.png"
  remove_alpha_ios: true
  image_path_ios_dark_transparent: "assets/brand/icon/app_icon_dark.png"
  image_path_ios_tinted_grayscale: "assets/brand/icon/app_icon_tinted.png"
  adaptive_icon_background: "assets/brand/icon/adaptive_background.png"
  adaptive_icon_foreground: "assets/brand/icon/adaptive_foreground.png"
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 24

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/
    - assets/icons/    # Alt klasördeki resimler için bunu EKLEMENİZ gerekir
    - assets/svgs/
    - assets/menuIcons/
    - assets/avatars/
    - assets/authors/
    - assets/authors/a/
    - assets/authors/cb/
    - assets/authors/cd/
    - assets/authors/cde/
    - assets/authors/cdmy/
    - assets/authors/cds/
    - assets/authors/cke/
    - assets/authors/cm/
    - assets/authors/ct/
    - assets/authors/ctg/
    - assets/authors/dn/
    - assets/authors/ds/
    - assets/authors/f/
    - assets/authors/m/
    - assets/authors/s/
    - assets/authors/t/
    - assets/authors/t1/
    - assets/authors/t2/
    - assets/brand/
    - assets/illustrations/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-ExtraBold.ttf
          weight: 800

# flutter_gen_runner: typed asset/font accessors (lib/gen/).
flutter_gen:
  output: lib/gen/
  line_length: 80
  integrations:
    flutter_svg: true

# flutter_native_splash (RTR): the navy launch screen of board 2.1 kare 1,
# same picture as `AppLockup(vertical, onNavy)` on `#0F294A`, in both themes.
# The images are the 4x renders of `assets/brand/smap_lockup_vertical_on_navy.svg`
# (461 x 616 px = 115,2 x 154 pt); the Android 12 icon is the same lockup
# drawn 1 pt = 1 dp into the 960 x 960 canvas (288 dp; the system masks it to a
# 192 dp circle, the lockup's farthest point is 91 dp from the center), so the
# hand-over to StartupView keeps the same size on Android 12 too.
# Regenerate with `dart run flutter_native_splash:create`.
flutter_native_splash:
  color: "#0F294A"
  image: assets/splash/smap_splash.png
  android_12:
    color: "#0F294A"
    icon_background_color: "#0F294A"
    image: assets/splash/smap_splash_android12.png
  ios_content_mode: center
  android_gravity: center
  fullscreen: false
