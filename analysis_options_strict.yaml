# Strict profile for NEW code (lib/core, lib/shared, lib/app, new features).
# The default analysis_options.yaml cannot scope rules by folder, and these
# lints fire in legacy code. A folder opts in with its own
# analysis_options.yaml:
#
#   include: ../../analysis_options_strict.yaml   # adjust the relative path
#
# Retire this file (merge into analysis_options.yaml) once the legacy
# screens are migrated.
include: analysis_options.yaml

linter:
  rules:
    prefer_const_constructors: true
    prefer_const_declarations: true
    use_decorated_box: true
