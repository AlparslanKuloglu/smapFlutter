name: CI

on:
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  push:
    branches: [main, redesign/main]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Same as the local toolchain (.puro.json); upgrade in its own PR.
  FLUTTER_VERSION: '3.38.6'

jobs:
  flutter:
    name: Flutter (l10n, codegen, analyze, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache-key: flutter-pub-:os:-:channel:-:version:-:arch:-${{ hashFiles('pubspec.lock') }}
      - name: pub get (lockfile must be in sync)
        run: flutter pub get --enforce-lockfile
      - name: l10n is merged, generated and committed
        run: |
          dart run tool/merge_arb.dart
          flutter gen-l10n
          if [ -n "$(git status --porcelain lib/l10n)" ]; then
            echo "::error::l10n output is stale. Run 'dart run tool/merge_arb.dart && flutter gen-l10n', then commit."
            git status --short lib/l10n
            exit 1
          fi
      - name: Generated code is committed and current
        run: |
          dart run build_runner build --delete-conflicting-outputs
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated files are stale. Run 'dart run build_runner build -d', then commit."
            git status --short
            exit 1
          fi
      - name: Format (lib/vendor excluded)
        run: tool/format.sh --output=none --set-exit-if-changed
      - name: Analyze (any issue fails; the legacy code is gone)
        run: flutter analyze --no-pub
      - name: UI rules (no raw colors, text styles, Material icons, dialogs)
        run: tool/ui_rules.sh
      - name: Test
        run: |
          if [ -d test ]; then
            flutter test --no-pub
          else
            echo "No test directory yet; skipping."
          fi
